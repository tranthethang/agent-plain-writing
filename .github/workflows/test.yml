name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.2"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests
      - name: Check generated skills
        run: python3 scripts/sync_shared.py --check
